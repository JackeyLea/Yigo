<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Mario Bros. - 网页版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="256" height="240"></canvas>
  <div id="hint">
    <b>操作(与原版一致)</b>
    <span>←→ 移动</span><span>Z / K / 空格 = A键(跳跃)</span><span>X / J = B键(跑/发火球)</span>
    <span>↑↓ 爬藤/下蹲/进水管</span><span>Enter / 回车 = Start(暂停)</span>
    <span>音效开关: M</span><span>AI 开关: N</span><span>AI 调试: B</span>
  </div>
</div>
<script src="js/leveldata.js"></script>
<script src="js/leveltables.js"></script>
<script src="js/leveldata_ll.js"></script>
<script src="js/font.js"></script>
<script src="js/tiles.js"></script>
<script src="js/sprites.js"></script>
<script src="js/datasets.js"></script>
<script src="js/audio.js"></script>
<script src="js/level.js"></script>
<script src="js/entities.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/main.js"></script>
</body>
</html>
