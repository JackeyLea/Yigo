# =============================================
# Chess Platform - Nginx Configuration
# =============================================
# Features:
#   - Load balancing across 3 app instances
#   - WebSocket support for real-time game updates
#   - Static file caching
#   - Gzip compression
#   - Rate limiting
#   - Security headers
# =============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =============================================
    # Logging Format
    # =============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # =============================================
    # Basic Settings
    # =============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;
    server_tokens off;

    # =============================================
    # Gzip Compression
    # =============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    gzip_min_length 1000;

    # =============================================
    # Rate Limiting Zones
    # =============================================
    # General API rate limit: 100 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Auth endpoints rate limit: 10 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Game move rate limit: 60 requests/minute per IP
    limit_req_zone $binary_remote_addr zone=game:10m rate=60r/m;

    # WebSocket connections limit
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    # =============================================
    # Upstream - Application Servers
    # =============================================
    upstream app_servers {
        least_conn;
        server app1:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app3:3000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # WebSocket upstream
    upstream ws_servers {
        ip_hash;  # Sticky sessions for WebSocket
        server app1:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server app3:3000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # =============================================
    # SSL Configuration
    # =============================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # =============================================
    # Proxy Settings
    # =============================================
    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # =============================================
    # Map Connection Upgrade
    # =============================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =============================================
    # Server Block - HTTP (redirect to HTTPS)
    # =============================================
    server {
        listen 80;
        server_name _;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check endpoint (accessible via HTTP)
        location /health {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Redirect all to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================
    # Server Block - HTTPS
    # =============================================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL certificates (managed by certbot)
        ssl_certificate /etc/letsencrypt/live/chess-platform.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chess-platform.example.com/privkey.pem;

        # =============================================
        # Security Headers
        # =============================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # =============================================
        # Static Files - Frontend Assets
        # =============================================
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # Favicon
        location = /favicon.ico {
            alias /var/www/static/favicon.ico;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            log_not_found off;
        }

        # =============================================
        # API Endpoints
        # =============================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app_servers;
        }

        # Auth endpoints with stricter rate limiting
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://app_servers;
        }

        # Game move endpoints
        location /api/game/ {
            limit_req zone=game burst=30 nodelay;
            proxy_pass http://app_servers;
        }

        # =============================================
        # WebSocket - Real-time Game
        # =============================================
        location /ws/ {
            limit_conn ws_conn 5;
            proxy_pass http://ws_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # =============================================
        # Socket.IO Support
        # =============================================
        location /socket.io/ {
            limit_conn ws_conn 5;
            proxy_pass http://ws_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # =============================================
        # SSE (Server-Sent Events)
        # =============================================
        location /events/ {
            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # =============================================
        # Default - Proxy to App
        # =============================================
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://app_servers;
        }
    }
}
