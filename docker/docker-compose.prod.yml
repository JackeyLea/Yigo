# =============================================
# Chess Platform - Production Environment
# =============================================
# Usage:
#   docker compose -f docker/docker-compose.prod.yml pull
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Services:
#   - App (3 replicas with load balancing)
#   - PostgreSQL 15 (persistent storage)
#   - Redis 7 (AOF persistence)
#   - Nginx Reverse Proxy
# =============================================

version: "3.9"

services:
  # Nginx - Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.25-alpine
    container_name: chess-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - chess-prod-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Application Instance 1
  app1:
    image: ${DOCKER_USERNAME}/chess-platform:latest
    container_name: chess-app-1
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-1
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - chess-prod-network

  # Application Instance 2
  app2:
    image: ${DOCKER_USERNAME}/chess-platform:latest
    container_name: chess-app-2
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-2
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - chess-prod-network

  # Application Instance 3
  app3:
    image: ${DOCKER_USERNAME}/chess-platform:latest
    container_name: chess-app-3
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      INSTANCE_ID: app-3
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - chess-prod-network

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: chess-postgres-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access for security
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - ./postgres/backups:/backups
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=2621kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_worker_processes=4"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "log_directory=/var/lib/postgresql/data/log"
      - "-c"
      - "log_filename=postgresql-%Y-%m-%d.log"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - chess-prod-network

  # Redis - Cache & Session Store (with persistence)
  redis:
    image: redis:7-alpine
    container_name: chess-redis-prod
    restart: always
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost access
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    sysctls:
      - net.core.somaxconn=65535
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - chess-prod-network

  # Database Backup (automated)
  backup:
    image: offen/docker-volume-backup:v2
    container_name: chess-backup
    restart: always
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"  # Daily at 3 AM
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_FILENAME: backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_ARCHIVE: "/archive"
      BACKUP_STOP_CONTAINER_LABEL: chess.backup.stop
      BACKUP_FROM_SNAPSHOT: "true"
      AWS_S3_BUCKET_NAME: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      AWS_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_S3_PATH: chess-platform-backups
      NOTIFICATION_URLS: ${BACKUP_NOTIFICATION_URL:-}
      NOTIFICATION_LEVEL: error
    volumes:
      - postgres_prod_data:/backup/postgres:ro
      - redis_prod_data:/backup/redis:ro
      - ./backups:/archive
    networks:
      - chess-prod-network
    profiles:
      - backup  # Only start with: docker compose --profile backup up -d

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  nginx_cache:
    driver: local
  certbot_data:
    driver: local
  certbot_www:
    driver: local

networks:
  chess-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
